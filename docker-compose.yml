name: local-transcription

services:
  asr-gateway:
    build:
      context: ./services/gateway
    image: local-transcription:0.2.1
    init: true
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-17003}:17003"
    volumes:
      - asr-huggingface:/root/.cache/huggingface
      - asr-modelscope:/root/.cache/modelscope
      - asr-data:/data
      - asr-logs:/logs
    environment:
      GATEWAY_PORT: 17003
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-300}
      ASR_READY_TIMEOUT: ${ASR_READY_TIMEOUT:-1800}
      ASR_MODEL: ${ASR_MODEL:-auto}
      LANGUAGE: ${LANGUAGE:-auto}
      ENABLE_DIARIZATION: ${ENABLE_DIARIZATION:-true}
      ENABLE_TIMESTAMPS: ${ENABLE_TIMESTAMPS:-true}
      ENABLE_FORCED_ALIGNER: ${ENABLE_FORCED_ALIGNER:-false}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      HF_HOME: /root/.cache/huggingface
      MODELSCOPE_PATH: /root/.cache/modelscope/models
      MODELSCOPE_CACHE: /root/.cache/modelscope
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  asr-huggingface:
  asr-modelscope:
  asr-data:
  asr-logs:
